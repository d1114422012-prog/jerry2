<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 性別平權 - 學習證書</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Microsoft JhengHei', sans-serif; }
        body { background: #F1F5F9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .control-panel { margin-bottom: 20px; text-align: center; }
        .control-panel input { padding: 10px 15px; font-size: 16px; border: 2px solid #CBD5E1; border-radius: 8px; margin-right: 10px; width: 220px; }
        .control-panel button { background: #3B82F6; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 5px; }
        .control-panel button:hover { background: #2563EB; }
        
        .certificate-card { background: white; width: 850px; padding: 50px; border: 12px solid #D4AF37; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; position: relative; }
        .certificate-card::before { content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px; border: 2px solid #D4AF37; pointer-events: none; }
        
        .cert-header { font-size: 28px; font-weight: bold; color: #475569; letter-spacing: 3px; margin-bottom: 10px; }
        .cert-title { font-size: 38px; font-weight: bold; color: #B8860B; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        .cert-body { font-size: 18px; color: #334155; line-height: 1.8; margin: 30px 0; }
        .student-name { font-size: 32px; font-weight: bold; color: #1E293B; border-bottom: 3px solid #D4AF37; display: inline-block; padding: 0 20px; margin: 0 5px; }
        
        .award-badge { font-size: 24px; font-weight: bold; color: #C0392B; background: #FFF5F5; border: 2px dashed #E74C3C; display: inline-block; padding: 10px 30px; border-radius: 30px; margin: 20px 0; }
        
        .cert-footer { display: flex; justify-content: space-between; margin-top: 50px; padding: 0 30px; font-size: 16px; color: #64748B; font-weight: bold; }
        
        @media print {
            body { background: white; padding: 0; }
            .control-panel { display: none; }
            .certificate-card { border: 10px solid #D4AF37; box-shadow: none; width: 100%; max-width: none; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <input type="text" id="nameInput" placeholder="請輸入您的姓名" oninput="updateName(this.value)">
        <button onclick="window.print()">📥 下載 / 列印證書</button>
        <button onclick="location.href='index.html'" style="background: #10B981;">🏠 返回第一關</button>
    </div>

    <div class="certificate-card">
        <div class="cert-header">聯合國永續發展目標 (SDGs) 學習成就證明</div>
        <div class="cert-title">結業證書</div>
        
        <div class="cert-body">
            茲證明學習者 <span class="student-name" id="displayName">學習者</span> 參與「SDGs 性別平權」闖關遊戲，<br>
            一路過關斬將，表現優異，特此授與：
        </div>

        <div class="award-badge">
            🏆 「SDGs 性別平權小達人」 榮譽稱號
        </div>

        <div class="cert-footer">
            <div>授證單位：SDGs 教育遊戲中心</div>
            <div>中華民國 115 年 3 月</div>
        </div>
    </div>

    <script>
        function updateName(val) {
            const name = val.trim() !== '' ? val : '學習者';
            document.getElementById('displayName').innerText = name;
        }
    </script>
</body>
</html>
